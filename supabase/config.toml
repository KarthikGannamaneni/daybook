project_id = "khata"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# 30 days on a trusted device (§4.1).
[auth.sessions]
timebox = "720h"

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false
# GoTrue throttles resends to one every 5 seconds by default, which the local
# smoke suite trips when several tests sign in as the same number in a row.
max_frequency = "1s"
# §4.1: local dev signs in with OTP 123456 for these numbers.
test_otp = { 919999900001 = "123456", 919999900002 = "123456", 919999900003 = "123456" }

# GoTrue refuses phone sign-in unless some provider is declared, even when every
# number in use is covered by test_otp above. These are placeholders: a test-OTP
# number short-circuits before any provider call, so nothing here is ever used
# and nothing here is a secret. Production uses the Supabase dashboard settings.
[auth.sms.twilio]
enabled = true
account_sid = "local-dev-unused"
message_service_sid = "local-dev-unused"
auth_token = "local-dev-unused"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
